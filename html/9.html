<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>HTML5 Input Types</title></head><body>
<h1>HTML5 Input Types</h1><form><label>Email: <input type="email" placeholder="student@example.com" required></label><br><label>Date: <input type="date"></label><br><label>Number: <input type="number" min="1" max="100"></label><br><label>Password: <input type="password" minlength="8"></label><br><button type="submit">Submit</button></form>
