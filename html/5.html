<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Student Registration</title><style>body{font-family:Arial;max-width:600px;margin:2rem auto;}label{display:block;margin-top:12px;}input,select,textarea{width:100%;padding:8px;margin-top:4px;}button{margin-top:16px;padding:10px 20px;}</style></head><body>
<h1>Student Registration Form</h1>
<form action="#" method="post"><label>Full Name <input type="text" name="name" required></label><label>Email <input type="email" name="email" required></label><label>Password <input type="password" name="password" required></label><label>Course <select name="course"><option>BCA</option><option>BSc Computer Science</option><option>BTech</option></select></label><label>Address <textarea name="address" rows="4"></textarea></label><label><input type="checkbox" required> I agree to the terms.</label><button type="submit">Register</button></form>
</body></html>
