<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>HTML Lists</title></head><body>
<h1>HTML Lists</h1>
<h2>Ordered List</h2><ol><li>Wake up</li><li>Attend class</li><li>Complete homework</li></ol>
<h2>Unordered List</h2><ul><li>HTML</li><li>CSS</li><li>JavaScript</li></ul>
<h2>Description List</h2><dl><dt><strong>HTML</strong></dt><dd>Structures a web page.</dd><dt><strong>CSS</strong></dt><dd>Styles a web page.</dd></dl>
</body></html>
