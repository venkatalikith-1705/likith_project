<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Exercises</title>
  <style>body{font-family:Arial,sans-serif;max-width:760px;margin:2rem auto;padding:0 1rem;background:#f8fafc;color:#172033}h1{color:#175cd3}ul{columns:3;padding:0;list-style:none}li{margin:.45rem 0}a{color:#175cd3;text-decoration:none}a:hover{text-decoration:underline}@media(max-width:600px){ul{columns:1}}</style>
</head>
<body>
  <h1>HTML Exercises</h1>
  <p>Open an exercise:</p>
  <ul id="links"></ul>
  <script>
    const links = document.querySelector("#links");
    for (let number = 1; number <= 15; number++) {
      links.insertAdjacentHTML("beforeend", `<li><a href="${number}.html">Question ${number}</a></li>`);
    }
  </script>
</body>
</html>
