<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>HTML Tables</title><style>table{border-collapse:collapse;width:70%;}th,td{border:1px solid #333;padding:10px;text-align:center;}th{background:#dbeafe;}</style></head><body>
<h1>Table with Rows, Columns, Borders, and Merged Cells</h1>
<table><tr><th rowspan="2">Department</th><th colspan="2">Employee Details</th></tr><tr><th>Name</th><th>Role</th></tr><tr><td rowspan="2">Development</td><td>Asha</td><td>Frontend Developer</td></tr><tr><td>Rahul</td><td>Backend Developer</td></tr><tr><td>Design</td><td>Meera</td><td>UI Designer</td></tr></table>
</body></html>
